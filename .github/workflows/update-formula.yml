name: Update formula

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula from latest fork release
        run: script/update-formula

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(ruby -e 'print File.read("Formula/goose.rb")[/version "([^"]+)"/, 1]')"
          git add Formula/goose.rb
          git commit -m "goose v$version"
          git push
