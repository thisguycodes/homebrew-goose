name: Update formula

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the fork has a release
        id: check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/thisguycodes/goose/releases/latest)
          echo "has_release=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Regenerate formula from latest fork release
        if: steps.check.outputs.has_release == 'true'
        run: script/update-formula

      - name: Commit and push if changed
        if: steps.check.outputs.has_release == 'true'
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(ruby -e 'print File.read("Formula/goose.rb")[/version "([^"]+)"/, 1]')"
          git add Formula/goose.rb
          git commit -m "goose v$version"
          git push
